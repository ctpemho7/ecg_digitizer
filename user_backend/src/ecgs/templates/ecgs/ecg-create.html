{% extends 'ecgs/base.html' %}

{% block content %}
<section>
    <div class="alert alert-warning text-center" role="alert">
        Пожалуйста, заполните адрес электронной почты.
    </div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7">

                <div class="card shadow-lg border-0 rounded-lg mt-5">
                    <div class="card-header">
                        <h3 class="text-center font-weight-light my-4">Укажите параметры ЭКГ</h3>
                    </div>
                    <div class="card-body">
                        <form action="{% url 'ecgs:ecg_create' %}" method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="form-group mt-3">
                                <label class="small mb-1" for="{{ form.name.id_for_label }}">Название</label>
                                {{ form.name }}
                            </div>

                            <div class="form-group mt-3">
                                <label class="small mb-1" for="{{ form.description.id_for_label }}">Описание</label>
                                {{ form.description }}
                            </div>

                            <div class="form-group mt-3">
                                <label class="small mb-1" for="{{ form.date.id_for_label }}">Дата</label>
                                {{ form.date }}
                            </div>

                            <div class="form-group mt-3">
                                <label class="small mb-1" for="{{ form.amplitude.id_for_label }}">Амплитуда
                                    (мм/мВ)</label>
                                {{ form.amplitude }}
                            </div>

                            <div class="form-group mt-3">
                                <label class="small mb-1" for="{{ form.write_speed.id_for_label }}">Скорость записи
                                    (мм/с)</label>
                                {{ form.write_speed }}
                            </div>

                            <div class="form-group mt-3">
                                <label class="small mb-1" for="{{ form.images.id_for_label }}">Изображения</label>
                                {{ form.images }}
                            </div>

                            <hr class="my-4">

                            <div class="form-group d-flex align-items-center justify-content-end mt-4 mb-0">
                                <button class="btn btn-primary w-100" type="submit">Продолжить</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
