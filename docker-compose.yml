version: "3.9"

services:
    user_backend:
        build: user_backend
        image: user_backend
        env_file:
            - ./user_backend/.env
        volumes:
            - ./user_backend/src:/src
            - ./user_backend/media:/media
            - ./user_backend/static:/static
        command: python manage.py runserver 0.0.0.0:8000
        ports:
            - "8000:8000"
        depends_on:
            db:
                condition: service_healthy
            minio:
                condition: service_started
            createbucket:
                condition: service_started

        restart: always
        networks:
            - ecg_network

    yolo-detector:
        build: detector
        command: uvicorn main:app --reload --host 0.0.0.0 --port=8010
        ports:
            - "8010:8010"
        volumes:
            - ./detector/src:/src
            - ./detector/media:/media
        env_file:
            - ./detector/src/.env
        networks:
            - ecg_network


    db:
        image: postgres:14-alpine
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
            POSTGRES_USER: ${POSTGRES_USER:-ecg_user}
            POSTGRES_DB: ${POSTGRES_DB:-ecg_db}
        ports:
            - "5432:5432"
        expose:
            - 5432
        volumes:
            - postgres_db:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "sh -c 'pg_isready -U ecg_user -d ecg_db'" ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - ecg_network


    minio:
        image: minio/minio:latest
        ports:
          - "9000:9000"
          - "9001:9001"
        volumes:
          - minio_data:/data
        environment:
          - "MINIO_ROOT_USER=user"
          - "MINIO_ROOT_PASSWORD=password"
        command: server /data --console-address :9001
        networks:
            - ecg_network

    createbucket:
        image: minio/mc:latest
        depends_on:
          - minio
        entrypoint: >
          /bin/sh -c "
          /usr/bin/mc config host add --api s3v4 s3 http://minio:9000 user password;
          /usr/bin/mc mb s3/static/;
          /usr/bin/mc policy set none  s3/static;
          "
        networks:
            - ecg_network

volumes:
  postgres_db:
    name: postgres_db
  minio_data:
    name: minio_data

networks:
    ecg_network:
        driver: bridge
