version: "3.9"

services:
    # Backend Django для загрузки ЭКГ
    user_backend:
        build: user_backend
        image: user_backend
        env_file:
            - ./user_backend/.env
        volumes:
            - ./user_backend/src:/src
            - ./user_backend/media:/media
            - ./user_backend/static:/static
        command: python manage.py runserver 0.0.0.0:8000
        ports:
            - "8000:8000"
        depends_on:
            db:
                condition: service_healthy
            minio:
                condition: service_started
            createbucket:
                condition: service_started

        restart: always
        networks:
            - ecg_network

    # Сервис оцифровки ЭКГ
    digitizer:
        build: digitizer
        container_name: digitizer
        command: uvicorn main:app --reload --host 0.0.0.0 --port=8010
        ports:
            - "8010:8010"
        volumes:
            - ./digitizer/src:/src
        env_file:
            - ./digitizer/src/.env
        networks:
            - ecg_network

    # Redis брокер сообщений для Celery
    redis:
        image: redis:7-alpine
        environment:
          - REDIS_HOST=${REDIS_HOST:-redis}
          - REDIS_PORT=${REDIS_PORT:-6379}
          - ALLOW_EMPTY_PASSWORD=yes
        ports:
          - "6379:6379"
        restart: on-failure
        networks:
          - ecg_network

    # сервис распределенной очереди задач Celery
    user-backend-celery:
        build: user_backend
        command: celery -A user_backend worker --loglevel=info
        volumes:
          - ./user_backend/src:/src
        env_file:
          - ./user_backend/.env
        depends_on:
          redis:
            condition: service_started
          db:
            condition: service_healthy
        restart: on-failure
        networks:
          - ecg_network

    # ML backend для автоматического распознавания отведений
    ml-backend:
        container_name: ml-backend
        image: humansignal/ml-backend:v0
        build:
          context: roboflow_detector
          args:
            TEST_ENV: ${TEST_ENV:-False}
        environment:
          # specify these parameters if you want to use basic auth for the model server
          #- BASIC_AUTH_USER=
          #- BASIC_AUTH_PASS=
          # set the log level for the model server
          - LOG_LEVEL=DEBUG
          # any other parameters that you want to pass to the model server
          - ANY=PARAMETER
          # specify the number of workers and threads for the model server
          - WORKERS=1
          - THREADS=8
          # specify the model directory (likely you don't need to change this)
          - MODEL_DIR=/data/models

          # Specify the Label Studio URL and API key to access
          # uploaded, local storage and cloud storage files.
          # Do not use 'localhost' as it does not work within Docker containers.
          # Use prefix 'http://' or 'https://' for the URL always.
          # Determine the actual IP using 'ifconfig' (Linux/Mac) or 'ipconfig' (Windows).
          - LABEL_STUDIO_URL=http://label-studio
          - LABEL_STUDIO_API_KEY=
          # for s3 storage you can specify AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY,
          # it will work faster than using intermediate LS API for your file URL resolving from s3
          - AWS_ACCESS_KEY_ID=
          - AWS_SECRET_ACCESS_KEY=
          # key for roboflow
          - ROBOFLOW_API_KEY=
        ports:
          - "9090:9090"
        volumes:
          - "./data/server:/data"
        networks:
            - ecg_network

    # Label Studio для разметки ЭКГ
    label-studio:
        image: heartexlabs/label-studio:latest
        ports:
            - "8080:8080"
        volumes:
            - label_sudio_data:/label-studio/data

    # PostgreSQL для хранения информации об ЭКГ
    db:
        image: postgres:14-alpine
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
            POSTGRES_USER: ${POSTGRES_USER:-ecg_user}
            POSTGRES_DB: ${POSTGRES_DB:-ecg_db}
        ports:
            - "5432:5432"
        expose:
            - 5432
        volumes:
            - postgres_db:/var/lib/postgresql/data
        healthcheck:
            test: [ "CMD-SHELL", "sh -c 'pg_isready -U ecg_user -d ecg_db'" ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - ecg_network

    # S3 хранилище для хранения изображений и оцифрованных ЭКГ
    minio:
        image: minio/minio:latest
        ports:
          - "9000:9000"
          - "9001:9001"
        volumes:
          - minio_data:/data
        environment:
          - "MINIO_ROOT_USER=user"
          - "MINIO_ROOT_PASSWORD=password"
        command: server /data --console-address :9001
        networks:
            - ecg_network

    # создание бакетов в S3 хранилище
    createbucket:
        image: minio/mc:latest
        depends_on:
          - minio
        entrypoint: >
          /bin/sh -c "
          /usr/bin/mc config host add --api s3v4 s3 http://minio:9000 user password;
          /usr/bin/mc mb s3/static/;
          /usr/bin/mc mb s3/media/;
          /usr/bin/mc policy set none  s3/static;
          /usr/bin/mc policy set none  s3/media;
          "
        networks:
            - ecg_network

volumes:
  postgres_db:
    name: postgres_db
  minio_data:
    name: minio_data
  label_sudio_data:
    name: label_sudio_data

networks:
    ecg_network:
        driver: bridge
